<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accordion Test</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 20px; }
    .debug-info {
      background: #f0f0f0;
      padding: 10px;
      margin: 20px 0;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Accordion Test Page</h1>

  <div class="debug-info">
    <strong>Debug Info:</strong>
    <div id="debug-output"></div>
  </div>

  <div class="main-content">
    <h2>Test Accordion</h2>

    <div class="accordion-item" id="test-1">
      <h3 class="accordion-header">
        <div class="accordion-header-content">
          <span class="date">テスト日付</span>
          <span class="title">テストタイトル 1</span>
        </div>
        <span class="accordion-icon"></span>
      </h3>
      <div class="accordion-content">
        <p>これはテストコンテンツです。アコーディオンが正しく開くはずです。</p>
        <p>このテキストが表示されれば、アコーディオンは正常に動作しています。</p>
      </div>
    </div>

    <div class="accordion-item" id="test-2">
      <h3 class="accordion-header">
        <div class="accordion-header-content">
          <span class="date">テスト日付 2</span>
          <span class="title">テストタイトル 2</span>
        </div>
        <span class="accordion-icon"></span>
      </h3>
      <div class="accordion-content">
        <p>2つ目のアコーディオンのコンテンツです。</p>
      </div>
    </div>
  </div>

  <script>
    // Debug output
    const debugOutput = document.getElementById('debug-output');

    function log(message) {
      const p = document.createElement('p');
      p.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      debugOutput.appendChild(p);
    }

    document.addEventListener('DOMContentLoaded', function() {
      log('DOMContentLoaded fired');

      const headers = document.querySelectorAll('.accordion-header');
      log(`Found ${headers.length} accordion headers`);

      headers.forEach((header, index) => {
        log(`Setting up header ${index + 1}`);

        header.addEventListener('click', function() {
          log(`Header ${index + 1} clicked`);

          const item = this.parentElement;
          const content = this.nextElementSibling;
          const isActive = this.classList.contains('active');

          log(`  - Item: ${item.className}`);
          log(`  - Content exists: ${!!content}`);
          log(`  - Is active: ${isActive}`);

          if (isActive) {
            this.classList.remove('active');
            item.classList.remove('active');
            log('  - Removed active class');
          } else {
            this.classList.add('active');
            item.classList.add('active');
            log('  - Added active class');
          }

          // Check computed styles
          const computedStyle = window.getComputedStyle(content);
          log(`  - Max-height: ${computedStyle.maxHeight}`);
          log(`  - Padding: ${computedStyle.padding}`);
        });
      });

      log('Setup complete');
    });
  </script>
</body>
</html>
